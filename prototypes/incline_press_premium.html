<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lutande hantelpress - animationsprototyp</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #12201c;
      --muted: #66716c;
      --line: rgba(18, 32, 28, 0.14);
      --accent: #b8ec52;
      --panel: rgba(247, 249, 247, 0.9);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #edf1ee;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 520px;
      isolation: isolate;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .header {
      position: absolute;
      z-index: 2;
      top: clamp(20px, 4vw, 44px);
      left: clamp(20px, 5vw, 64px);
      max-width: min(440px, calc(100vw - 40px));
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #24745f;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 420px;
      font-size: clamp(30px, 4.4vw, 58px);
      font-weight: 760;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .meta i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #24745f;
    }

    .technique {
      position: absolute;
      z-index: 2;
      left: clamp(20px, 5vw, 64px);
      bottom: clamp(20px, 4vw, 42px);
      display: grid;
      gap: 7px;
      max-width: 350px;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 14px 34px rgba(25, 43, 37, 0.08);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .technique strong {
      font-size: 13px;
      line-height: 1.2;
    }

    .technique span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 570;
      line-height: 1.35;
    }

    .muscle {
      position: absolute;
      z-index: 2;
      right: clamp(20px, 4vw, 44px);
      top: clamp(20px, 4vw, 44px);
      display: flex;
      align-items: center;
      gap: 9px;
      color: #365148;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      pointer-events: none;
    }

    .muscle::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(184, 236, 82, 0.2);
      content: "";
    }

    .toggle {
      position: absolute;
      z-index: 3;
      right: clamp(20px, 4vw, 44px);
      bottom: clamp(20px, 4vw, 42px);
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      border: 1px solid rgba(18, 32, 28, 0.16);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      box-shadow: 0 12px 30px rgba(25, 43, 37, 0.13);
      font: inherit;
      font-size: 17px;
      cursor: pointer;
    }

    .toggle:hover { transform: translateY(-1px); }
    .toggle:focus-visible { outline: 3px solid rgba(36, 116, 95, 0.3); outline-offset: 3px; }

    .loading {
      position: absolute;
      z-index: 4;
      inset: 0;
      display: grid;
      place-items: center;
      background: #edf1ee;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .loading[hidden] { display: none; }

    @media (max-width: 680px) {
      main { min-height: 460px; }
      .header { top: 20px; }
      .eyebrow { margin-bottom: 6px; }
      h1 { max-width: 300px; font-size: 32px; }
      .meta { margin-top: 9px; font-size: 12px; }
      .muscle { top: auto; right: auto; left: 20px; bottom: 126px; }
      .technique { right: 84px; bottom: 18px; max-width: none; padding: 12px 14px; }
      .technique span { display: none; }
      .toggle { right: 20px; bottom: 18px; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <div class="header">
      <p class="eyebrow">Utförande</p>
      <h1>Lutande hantelpress</h1>
      <div class="meta"><span>30° bänk</span><i></i><span>6–10 reps</span></div>
    </div>

    <div class="muscle">Bröst</div>

    <div class="technique">
      <strong>Skuldror bak och ner</strong>
      <span>Sänk kontrollerat tills armbågarna är strax under axlarna.</span>
    </div>

    <button class="toggle" id="toggle" type="button" aria-label="Pausa animationen">Ⅱ</button>
    <div class="loading" id="loading" role="status">Laddar rörelsen…</div>
  </main>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

    const stage = document.getElementById("stage");
    const loading = document.getElementById("loading");
    const toggle = document.getElementById("toggle");

    const palette = {
      skin: 0xb6a89d,
      skinShadow: 0x9f9186,
      top: 0x126956,
      topDark: 0x0b4e41,
      shorts: 0x26322f,
      shoe: 0xe3e7e4,
      metal: 0x34413e,
      metalDark: 0x1b2522,
      pad: 0x26312e,
      dumbbell: 0x1c2422,
      handle: 0xa8b2ad,
      accent: 0xb8ec52,
      floor: 0xdfe5e1,
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xedf1ee);
    scene.fog = new THREE.Fog(0xedf1ee, 10, 20);

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    camera.position.set(5.6, 3.65, 7.2);
    camera.lookAt(0, 1.35, 0.05);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.setAttribute("role", "img");
    renderer.domElement.setAttribute("aria-label", "En tredimensionell figur visar lutande hantelpress");
    stage.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7771, 1.55));

    const key = new THREE.DirectionalLight(0xfffdf7, 3.2);
    key.position.set(4.5, 8, 5.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 0.1;
    key.shadow.camera.far = 24;
    key.shadow.camera.left = -6;
    key.shadow.camera.right = 6;
    key.shadow.camera.top = 7;
    key.shadow.camera.bottom = -4;
    key.shadow.bias = -0.0004;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xa9d7c9, 1.15);
    fill.position.set(-5, 4, 2);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xd6ff7c, 0.78);
    rim.position.set(2, 5, -6);
    scene.add(rim);

    const material = (color, options = {}) => new THREE.MeshStandardMaterial({
      color,
      roughness: options.roughness ?? 0.72,
      metalness: options.metalness ?? 0.02,
      flatShading: options.flatShading ?? false,
      transparent: options.transparent ?? false,
      opacity: options.opacity ?? 1,
    });

    const mats = {
      skin: material(palette.skin, { roughness: 0.78 }),
      skinShadow: material(palette.skinShadow, { roughness: 0.82 }),
      top: material(palette.top, { roughness: 0.68 }),
      topDark: material(palette.topDark, { roughness: 0.72 }),
      shorts: material(palette.shorts, { roughness: 0.8 }),
      shoe: material(palette.shoe, { roughness: 0.66 }),
      sole: material(palette.metalDark, { roughness: 0.88 }),
      metal: material(palette.metal, { roughness: 0.42, metalness: 0.55 }),
      metalDark: material(palette.metalDark, { roughness: 0.5, metalness: 0.5 }),
      pad: material(palette.pad, { roughness: 0.9 }),
      dumbbell: material(palette.dumbbell, { roughness: 0.46, metalness: 0.62 }),
      handle: material(palette.handle, { roughness: 0.32, metalness: 0.74 }),
      accent: material(palette.accent, { roughness: 0.58, transparent: true, opacity: 0.92 }),
    };

    const addMesh = (geometry, mat, parent = scene) => {
      const mesh = new THREE.Mesh(geometry, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    };

    const v = (x, y, z) => new THREE.Vector3(x, y, z);
    const mix = (a, b, t) => a.clone().lerp(b, t);

    const segment = (radius, mat, radialSegments = 16) => {
      const mesh = addMesh(new THREE.CapsuleGeometry(radius, 1, 7, radialSegments), mat);
      const up = new THREE.Vector3(0, 1, 0);
      return {
        mesh,
        update(start, end, thickness = 1) {
          const delta = end.clone().sub(start);
          const length = Math.max(0.001, delta.length());
          mesh.position.copy(start).add(end).multiplyScalar(0.5);
          mesh.quaternion.setFromUnitVectors(up, delta.normalize());
          mesh.scale.set(thickness, Math.max(0.05, length - radius * 2), thickness);
        },
      };
    };

    const roundedPart = (size, mat, parent = scene) => {
      const mesh = addMesh(new THREE.BoxGeometry(size.x, size.y, size.z, 3, 3, 3), mat, parent);
      return mesh;
    };

    const alignBetween = (mesh, start, end) => {
      const delta = end.clone().sub(start);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.clone().normalize());
      mesh.scale.y = delta.length();
    };

    // Quiet gym floor and contact shadows.
    const floor = addMesh(new THREE.PlaneGeometry(30, 30), material(palette.floor, { roughness: 1 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;

    const contact = addMesh(
      new THREE.CircleGeometry(3.15, 64),
      material(0xcbd4ce, { roughness: 1, transparent: true, opacity: 0.55 })
    );
    contact.rotation.x = -Math.PI / 2;
    contact.position.y = 0.006;
    contact.receiveShadow = true;

    // Bench: 30-degree back pad, separate seat and stable steel frame.
    const bench = new THREE.Group();
    scene.add(bench);

    const backStart = v(0, 0.84, 0.58);
    const backEnd = v(0, 2.08, -1.28);
    const backPad = roundedPart(v(0.88, 1, 0.18), mats.pad, bench);
    alignBetween(backPad, backStart, backEnd);

    const seat = roundedPart(v(0.92, 0.17, 0.88), mats.pad, bench);
    seat.position.set(0, 0.82, 0.82);
    seat.rotation.x = -0.08;

    const frameParts = [];
    const makeFrame = (start, end, radius = 0.065) => {
      const part = segment(radius, mats.metal, 12);
      part.update(start, end);
      frameParts.push(part.mesh);
      return part;
    };
    makeFrame(v(0, 0.72, 0.56), v(0, 0.14, 0.5));
    makeFrame(v(0, 0.18, 0.5), v(0, 0.18, -1.35));
    makeFrame(v(-0.64, 0.13, -1.35), v(0.64, 0.13, -1.35));
    makeFrame(v(-0.68, 0.13, 0.62), v(0.68, 0.13, 0.62));
    makeFrame(v(0, 0.42, -0.2), v(0, 1.54, -1.06), 0.045);

    // Figure with tapered, jointed proportions.
    const torso = segment(0.34, mats.top, 20);
    const waist = segment(0.25, mats.topDark, 18);
    const neck = segment(0.115, mats.skin, 16);
    const leftUpperArm = segment(0.14, mats.top, 18);
    const rightUpperArm = segment(0.14, mats.top, 18);
    const leftForearm = segment(0.12, mats.skin, 18);
    const rightForearm = segment(0.12, mats.skin, 18);
    const leftThigh = segment(0.19, mats.shorts, 18);
    const rightThigh = segment(0.19, mats.shorts, 18);
    const leftShin = segment(0.145, mats.skinShadow, 18);
    const rightShin = segment(0.145, mats.skinShadow, 18);

    const pelvis = addMesh(new THREE.SphereGeometry(0.34, 24, 18), mats.shorts);
    pelvis.scale.set(1.02, 0.72, 0.88);
    const head = addMesh(new THREE.SphereGeometry(0.255, 28, 20), mats.skin);
    head.scale.set(0.88, 1.08, 0.95);

    const joint = (radius, mat = mats.skin) => addMesh(new THREE.SphereGeometry(radius, 20, 16), mat);
    const leftElbow = joint(0.132);
    const rightElbow = joint(0.132);
    const leftHand = joint(0.128);
    const rightHand = joint(0.128);
    const leftKnee = joint(0.175, mats.shorts);
    const rightKnee = joint(0.175, mats.shorts);

    const makeShoe = () => {
      const group = new THREE.Group();
      const upper = addMesh(new THREE.CapsuleGeometry(0.13, 0.34, 7, 16), mats.shoe, group);
      upper.rotation.x = Math.PI / 2;
      upper.scale.set(1, 1.03, 0.75);
      const sole = roundedPart(v(0.29, 0.055, 0.5), mats.sole, group);
      sole.position.set(0, -0.12, 0.06);
      return group;
    };
    const leftShoe = makeShoe();
    const rightShoe = makeShoe();
    scene.add(leftShoe, rightShoe);

    const makeDumbbell = () => {
      const group = new THREE.Group();
      const handle = addMesh(new THREE.CylinderGeometry(0.035, 0.035, 0.42, 18), mats.handle, group);
      handle.rotation.z = Math.PI / 2;
      for (const x of [-0.25, 0.25]) {
        const inner = addMesh(new THREE.CylinderGeometry(0.13, 0.13, 0.095, 20), mats.dumbbell, group);
        inner.rotation.z = Math.PI / 2;
        inner.position.x = x;
        const outer = addMesh(new THREE.CylinderGeometry(0.16, 0.16, 0.085, 20), mats.dumbbell, group);
        outer.rotation.z = Math.PI / 2;
        outer.position.x = x + Math.sign(x) * 0.08;
      }
      return group;
    };
    const leftDumbbell = makeDumbbell();
    const rightDumbbell = makeDumbbell();
    scene.add(leftDumbbell, rightDumbbell);

    // Chest highlight: subtle geometry, not a glowing sticker.
    const leftPec = addMesh(new THREE.SphereGeometry(0.19, 24, 16), mats.accent);
    const rightPec = addMesh(new THREE.SphereGeometry(0.19, 24, 16), mats.accent);
    leftPec.scale.set(1.25, 0.52, 0.42);
    rightPec.scale.copy(leftPec.scale);
    leftPec.rotation.x = 0.58;
    rightPec.rotation.x = 0.58;

    const staticPose = {
      pelvis: v(0, 1.04, 0.45),
      waist: v(0, 1.24, 0.12),
      chest: v(0, 1.58, -0.4),
      neck: v(0, 1.91, -0.9),
      head: v(0, 2.18, -1.24),
      shoulderLeft: v(-0.43, 1.72, -0.58),
      shoulderRight: v(0.43, 1.72, -0.58),
      hipLeft: v(-0.22, 1.04, 0.43),
      hipRight: v(0.22, 1.04, 0.43),
      kneeLeft: v(-0.3, 0.78, 1.36),
      kneeRight: v(0.3, 0.78, 1.36),
      ankleLeft: v(-0.32, 0.2, 1.66),
      ankleRight: v(0.32, 0.2, 1.66),
      footLeft: v(-0.32, 0.18, 1.89),
      footRight: v(0.32, 0.18, 1.89),
    };

    const bottom = {
      elbowLeft: v(-0.94, 1.68, -0.03),
      elbowRight: v(0.94, 1.68, -0.03),
      handLeft: v(-0.58, 2.02, -0.2),
      handRight: v(0.58, 2.02, -0.2),
    };

    const top = {
      elbowLeft: v(-0.48, 2.55, 0.12),
      elbowRight: v(0.48, 2.55, 0.12),
      handLeft: v(-0.37, 2.92, 0.39),
      handRight: v(0.37, 2.92, 0.39),
    };

    const updateFigure = (progress, elapsed) => {
      const breath = Math.sin(elapsed * 1.7) * 0.012;
      const chest = staticPose.chest.clone();
      chest.y += breath;

      const elbowLeftPos = mix(bottom.elbowLeft, top.elbowLeft, progress);
      const elbowRightPos = mix(bottom.elbowRight, top.elbowRight, progress);
      const handLeftPos = mix(bottom.handLeft, top.handLeft, progress);
      const handRightPos = mix(bottom.handRight, top.handRight, progress);

      pelvis.position.copy(staticPose.pelvis);
      head.position.copy(staticPose.head);
      head.rotation.x = -0.08;

      waist.update(staticPose.pelvis, staticPose.waist, 0.96);
      torso.update(staticPose.waist, chest, 1.03);
      neck.update(chest.clone().lerp(staticPose.neck, 0.82), staticPose.neck);

      leftUpperArm.update(staticPose.shoulderLeft, elbowLeftPos, 1.04);
      rightUpperArm.update(staticPose.shoulderRight, elbowRightPos, 1.04);
      leftForearm.update(elbowLeftPos, handLeftPos, 0.98);
      rightForearm.update(elbowRightPos, handRightPos, 0.98);
      leftElbow.position.copy(elbowLeftPos);
      rightElbow.position.copy(elbowRightPos);
      leftHand.position.copy(handLeftPos);
      rightHand.position.copy(handRightPos);

      leftThigh.update(staticPose.hipLeft, staticPose.kneeLeft, 1.02);
      rightThigh.update(staticPose.hipRight, staticPose.kneeRight, 1.02);
      leftShin.update(staticPose.kneeLeft, staticPose.ankleLeft, 0.98);
      rightShin.update(staticPose.kneeRight, staticPose.ankleRight, 0.98);
      leftKnee.position.copy(staticPose.kneeLeft);
      rightKnee.position.copy(staticPose.kneeRight);
      leftShoe.position.copy(staticPose.footLeft);
      rightShoe.position.copy(staticPose.footRight);
      leftShoe.rotation.x = 0.06;
      rightShoe.rotation.x = 0.06;

      leftDumbbell.position.copy(handLeftPos);
      rightDumbbell.position.copy(handRightPos);
      leftDumbbell.rotation.z = 0.08 - progress * 0.05;
      rightDumbbell.rotation.z = -0.08 + progress * 0.05;

      const pecBase = chest.clone().lerp(staticPose.neck, 0.2);
      leftPec.position.copy(pecBase).add(v(-0.2, 0.055, 0.22));
      rightPec.position.copy(pecBase).add(v(0.2, 0.055, 0.22));
      const contraction = 1 + progress * 0.1;
      leftPec.scale.set(1.25 * contraction, 0.52, 0.42);
      rightPec.scale.copy(leftPec.scale);
    };

    let playing = true;
    let heldProgress = 0;
    let animationTime = 0;
    let previousTime = performance.now();

    toggle.addEventListener("click", () => {
      playing = !playing;
      toggle.textContent = playing ? "Ⅱ" : "▶";
      toggle.setAttribute("aria-label", playing ? "Pausa animationen" : "Spela animationen");
    });

    const resize = () => {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / Math.max(height, 1);

      if (width < 680) {
        camera.position.set(5.9, 3.85, 8.4);
        camera.lookAt(0, 1.42, 0.1);
      } else {
        camera.position.set(5.6, 3.65, 7.2);
        camera.lookAt(0, 1.35, 0.05);
      }
      camera.updateProjectionMatrix();
    };

    window.addEventListener("resize", resize);
    resize();

    const render = (now) => {
      const delta = Math.min(0.05, (now - previousTime) / 1000);
      previousTime = now;
      if (playing) animationTime += delta;

      const phase = (animationTime % 4.2) / 4.2;
      // Smooth press with short, readable pauses at both ends.
      let progress;
      if (phase < 0.12) progress = 0;
      else if (phase < 0.47) {
        const t = (phase - 0.12) / 0.35;
        progress = t * t * (3 - 2 * t);
      } else if (phase < 0.59) progress = 1;
      else if (phase < 0.94) {
        const t = (phase - 0.59) / 0.35;
        progress = 1 - t * t * (3 - 2 * t);
      } else progress = 0;

      heldProgress = progress;
      updateFigure(heldProgress, animationTime);
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    };

    updateFigure(0, 0);
    loading.hidden = true;
    requestAnimationFrame(render);
  </script>
</body>
</html>
