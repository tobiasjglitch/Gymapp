<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobilkontroll - Lyftlogg animation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      background: #dfe5e1;
      color: #12201c;
      font-family: Inter, system-ui, sans-serif;
      letter-spacing: 0;
    }
    main {
      width: min(390px, 100%);
      overflow: hidden;
      border: 1px solid rgba(18, 32, 28, 0.16);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(25, 43, 37, 0.15);
    }
    header { padding: 17px 17px 13px; border-bottom: 1px solid rgba(18, 32, 28, 0.12); }
    h1 { margin: 0; font-size: 18px; line-height: 1.2; }
    p { margin: 5px 0 0; color: #68736e; font-size: 12px; font-weight: 650; }
    iframe { display: block; width: 100%; height: 430px; border: 0; background: #edf1ee; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Lutande hantelpress</h1>
      <p>Mobilvy · 390 px</p>
    </header>
    <iframe id="preview" title="Mobil förhandsvisning"></iframe>
  </main>
  <script>
    fetch("../assets/demos/exercise_3d.html")
      .then((response) => response.text())
      .then((template) => {
        document.getElementById("preview").srcdoc = template.replace(
          "__DEMO_CONFIG__",
          JSON.stringify({ name: "Lutande hantelpress", mode: "incline_press" })
        );
      });
  </script>
</body>
</html>
