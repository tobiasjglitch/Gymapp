<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyftlogg animationsstudio</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #e9eeea;
      --surface: #f8faf8;
      --ink: #12201c;
      --muted: #68736e;
      --line: rgba(18, 32, 28, 0.13);
      --green: #176b57;
      --lime: #b8ec52;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body { min-height: 100vh; }

    .app {
      display: grid;
      height: 100vh;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    header {
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px clamp(18px, 3vw, 38px);
      border-bottom: 1px solid var(--line);
      background: rgba(248, 250, 248, 0.94);
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 13px;
    }

    .mark {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 7px;
      background: var(--lime);
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
    }

    h1 {
      overflow: hidden;
      margin: 0;
      font-size: 20px;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .counter {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .workspace {
      display: grid;
      min-height: 0;
      grid-template-columns: minmax(220px, 292px) minmax(0, 1fr);
      overflow: hidden;
    }

    nav {
      overflow: auto;
      padding: 18px 12px 30px;
      border-right: 1px solid var(--line);
      background: #f2f5f2;
    }

    .batch { margin-bottom: 21px; }

    .batch h2 {
      margin: 0 10px 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .exercise {
      display: grid;
      width: 100%;
      min-height: 42px;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: center;
      margin: 2px 0;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .exercise:hover { background: rgba(255, 255, 255, 0.72); }

    .exercise[aria-current="true"] {
      border-color: rgba(23, 107, 87, 0.18);
      background: #fff;
      box-shadow: 0 8px 22px rgba(25, 43, 37, 0.06);
    }

    .number {
      color: #7b8681;
      font-size: 11px;
      font-weight: 780;
    }

    .exercise[aria-current="true"] .number { color: var(--green); }

    .name {
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: auto minmax(0, 1fr);
      padding: clamp(14px, 2.5vw, 28px);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      min-height: 55px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 2px 13px;
    }

    .current { min-width: 0; }

    .current strong {
      display: block;
      overflow: hidden;
      font-size: 16px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .controls { display: flex; gap: 7px; }

    .controls button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    .controls button:hover { border-color: rgba(23, 107, 87, 0.38); }
    button:focus-visible { outline: 3px solid rgba(23, 107, 87, 0.28); outline-offset: 2px; }

    .frame-wrap {
      min-height: 440px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #edf1ee;
      box-shadow: 0 18px 48px rgba(25, 43, 37, 0.09);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 440px;
      border: 0;
      background: #edf1ee;
    }

    @media (max-width: 760px) {
      header { min-height: 68px; padding: 12px 16px; }
      .brand p { display: none; }
      .counter { font-size: 11px; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 9px 12px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .batch { display: contents; }
      .batch h2 { display: none; }
      .exercise {
        width: auto;
        min-width: max-content;
        grid-template-columns: 22px auto;
        margin: 0;
        padding: 7px 10px;
      }
      .name { max-width: 170px; }
      .preview { padding: 10px 12px 12px; }
      .toolbar { min-height: 50px; padding-bottom: 9px; }
      .frame-wrap,
      iframe { min-height: 430px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark">↟</div>
        <div>
          <h1>Animationsstudio</h1>
          <p>Premiumprototyper för Lyftlogg</p>
        </div>
      </div>
      <div class="counter" id="counter">1 / 17</div>
    </header>

    <div class="workspace">
      <nav id="navigation" aria-label="Övningar"></nav>

      <section class="preview" aria-label="Förhandsvisning">
        <div class="toolbar">
          <div class="current">
            <strong id="current-name">Lutande hantelpress</strong>
            <span id="current-mode">incline_press</span>
          </div>
          <div class="controls">
            <button id="previous" type="button" aria-label="Föregående övning" title="Föregående">‹</button>
            <button id="next" type="button" aria-label="Nästa övning" title="Nästa">›</button>
          </div>
        </div>
        <div class="frame-wrap">
          <iframe id="demo" title="Animerat utförande"></iframe>
        </div>
      </section>
    </div>
  </div>

  <script>
    const batches = [
      {
        title: "Press och bröst",
        exercises: [
          ["Lutande hantelpress", "incline_press"],
          ["Kabel-flyes", "cable_fly"],
          ["Hantelpress plan bänk", "bench_press"],
          ["Bröstpressmaskin", "machine_chest_press"],
        ],
      },
      {
        title: "Axlar och roddar",
        exercises: [
          ["Bröststödd roddmaskin", "chest_supported_machine_row"],
          ["Sidolyft hantlar", "lateral_raise"],
          ["Bröststödd high row", "chest_supported_high_row"],
          ["Sidolyft i kabel", "cable_lateral_raise"],
          ["Omvänd pec deck - bakre axlar", "reverse_pec_deck"],
        ],
      },
      {
        title: "Rygg, kabel och armar",
        exercises: [
          ["Latsdrag, neutralt grepp", "neutral_grip_pulldown"],
          ["Sittande roddmaskin", "seated_machine_row"],
          ["Triceps pushdown", "triceps_pushdown"],
          ["Kabel-crunch", "cable_crunch"],
        ],
      },
      {
        title: "Ben och säte",
        exercises: [
          ["Hip thrust-maskin/Smith", "hip_thrust"],
          ["Benpress", "leg_press"],
          ["Sittande lårcurl", "leg_curl"],
          ["Höftabduktion i kabel/maskin", "hip_abduction"],
        ],
      },
    ];

    const exercises = batches.flatMap((batch) =>
      batch.exercises.map(([name, mode]) => ({ name, mode, batch: batch.title }))
    );

    const navigation = document.getElementById("navigation");
    const frame = document.getElementById("demo");
    const currentName = document.getElementById("current-name");
    const currentMode = document.getElementById("current-mode");
    const counter = document.getElementById("counter");
    const buttons = [];
    let template = "";
    let currentIndex = 0;

    for (const batch of batches) {
      const section = document.createElement("section");
      section.className = "batch";
      const heading = document.createElement("h2");
      heading.textContent = batch.title;
      section.append(heading);

      for (const [name, mode] of batch.exercises) {
        const index = exercises.findIndex((item) => item.name === name && item.mode === mode);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "exercise";
        button.innerHTML = `<span class="number">${String(index + 1).padStart(2, "0")}</span><span class="name"></span>`;
        button.querySelector(".name").textContent = name;
        button.addEventListener("click", () => showExercise(index));
        section.append(button);
        buttons[index] = button;
      }

      navigation.append(section);
    }

    const showExercise = (index) => {
      if (!template) return;
      currentIndex = (index + exercises.length) % exercises.length;
      const item = exercises[currentIndex];
      const config = JSON.stringify({ name: item.name, mode: item.mode });
      frame.srcdoc = template.replace("__DEMO_CONFIG__", config);
      currentName.textContent = item.name;
      currentMode.textContent = item.mode;
      counter.textContent = `${currentIndex + 1} / ${exercises.length}`;
      buttons.forEach((button, buttonIndex) => {
        button.setAttribute("aria-current", String(buttonIndex === currentIndex));
      });
      buttons[currentIndex].scrollIntoView({ block: "nearest", inline: "nearest" });
    };

    document.getElementById("previous").addEventListener("click", () => showExercise(currentIndex - 1));
    document.getElementById("next").addEventListener("click", () => showExercise(currentIndex + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") showExercise(currentIndex - 1);
      if (event.key === "ArrowRight") showExercise(currentIndex + 1);
    });

    fetch("../assets/demos/exercise_3d.html")
      .then((response) => {
        if (!response.ok) throw new Error("Kunde inte läsa animationstemplaten.");
        return response.text();
      })
      .then((html) => {
        template = html;
        showExercise(0);
      })
      .catch((error) => {
        frame.srcdoc = `<p style="font:600 14px system-ui;padding:24px;color:#b42318">${error.message}</p>`;
      });
  </script>
</body>
</html>
