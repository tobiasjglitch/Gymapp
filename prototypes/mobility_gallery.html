<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyftlogg - rörlighetspauser</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f3f6f3; color: #101512; font: 15px Inter, system-ui, sans-serif; }
    main { width: min(100%, 760px); margin: 0 auto; }
    h1 { margin: 0 0 16px; font-size: 22px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button { border: 1px solid #dce3de; border-radius: 8px; padding: 10px 12px; background: #fff; color: #101512; font: inherit; font-weight: 700; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #0d8066; background: #0d8066; color: #fff; }
    iframe { display: block; width: 100%; height: 470px; border: 1px solid #dce3de; border-radius: 8px; background: #edf1ee; }
  </style>
</head>
<body>
  <main>
    <h1>Rörlighetspauser</h1>
    <nav id="choices" aria-label="Välj rörlighetspaus"></nav>
    <iframe id="preview" title="Förhandsvisning av rörlighetspaus"></iframe>
  </main>
  <script>
    const demos = [
      ["Stånghäng", "mobility_dead_hang"],
      ["Djup squat med stöd", "mobility_deep_squat"],
      ["Bröstryggsrotation", "mobility_thoracic_rotation"],
      ["Höftböjarstretch", "mobility_hip_flexor"],
      ["Bröstöppnare", "mobility_chest_opener"],
    ];
    const choices = document.getElementById("choices");
    const preview = document.getElementById("preview");

    fetch("../assets/demos/exercise_3d.html")
      .then((response) => response.text())
      .then((template) => {
        const show = (index) => {
          const [name, mode] = demos[index];
          preview.srcdoc = template.replace(
            "__DEMO_CONFIG__",
            JSON.stringify({ name, mode, duration: 25 })
          );
          [...choices.children].forEach((button, buttonIndex) => {
            button.setAttribute("aria-pressed", String(buttonIndex === index));
          });
        };

        demos.forEach(([name], index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = name;
          button.addEventListener("click", () => show(index));
          choices.append(button);
        });
        show(0);
      });
  </script>
</body>
</html>
